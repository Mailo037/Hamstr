name: Release

# Push a tag like v0.2.0 and this builds signed APKs (one per ABI plus a universal one)
# and publishes them as a GitHub release. Hamstr's in-app updater installs from there.
# The desktop app is built on each system and added to it: a setup .exe and a portable .zip
# for Windows, a .dmg for macOS, a .deb for Linux. SHA256SUMS.txt then covers every file.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 ndk;28.2.13676358 cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v6

      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.HAMSTR_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HAMSTR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HAMSTR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HAMSTR_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::HAMSTR_KEYSTORE_B64 is not set; releases must be signed with the same key every time."
            exit 1
          fi
          mkdir -p signing
          echo "$KEYSTORE_B64" | base64 --decode > signing/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > signing/keystore.properties

      - name: Build
        run: ./gradlew --no-daemon assembleRelease -Phamstr.version="${GITHUB_REF_NAME#v}"

      - name: Collect APKs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir dist
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "dist/Hamstr-$VERSION-$abi.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -la dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=".github/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$NOTES" ]; then set -- --notes-file "$NOTES"; else set -- --generate-notes; fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --verify-tag "$@"

  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-latest, name: macos-arm64 }
          - { os: ubuntu-latest, name: linux-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Gradle configures the Android modules too, so the SDK has to be there.
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0"

      - uses: gradle/actions/setup-gradle@v6

      # Windows' setup is made with Inno Setup (desktop/windows/hamstr.iss).
      - name: Inno Setup
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then choco install innosetup -y --no-progress; fi

      - name: Installer
        shell: bash
        run: ./gradlew --no-daemon :desktop:packageDistributionForCurrentOS -Phamstr.version="${GITHUB_REF_NAME#v}"

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir dist
          for f in desktop/build/compose/binaries/main/*/*; do
            case "$f" in *.exe|*.dmg|*.deb) cp "$f" "dist/Hamstr-$VERSION-${{ matrix.name }}.${f##*.}" ;; esac
          done
          # Windows also gets the app folder as a zip, to unpack and run without installing.
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd desktop/build/compose/binaries/main/app && 7z a -tzip "$GITHUB_WORKSPACE/dist/Hamstr-$VERSION-${{ matrix.name }}-portable.zip" Hamstr > /dev/null)
          fi
          ls -la dist
          gh release upload "$GITHUB_REF_NAME" dist/*

  # One checksum file for the whole release: the APKs' plus every desktop file.
  checksums:
    needs: [release, desktop]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir all && cd all
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "Hamstr-*"
          sha256sum Hamstr-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
