name: Release

# Push a tag like v0.2.0 and this builds signed APKs (one per ABI plus a universal one)
# and publishes them as a GitHub release. Hamstr's in-app updater installs from there.
# The desktop app is built on each system and added to it: a setup .exe and a portable .zip
# for Windows, a .dmg for macOS, a .deb for Linux. SHA256SUMS.txt then covers every file.
#
# Without a terminal: Actions › Release › Run workflow on main, with the version (0.9.0). That
# run checks the version, builds, and makes the tag itself just before it publishes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.9.0). gradle.properties must say the same."
        required: true
        type: string

permissions:
  contents: write

# The release's tag: the pushed one, or v<version> for a run started by hand.
env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # Started by hand: refuse anything that would make a wrong release, before building.
      - name: Check version
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version must look like 1.2.3, not \"$VERSION\"."
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases come from main; this run is on $GITHUB_REF_NAME."
            exit 1
          fi
          DEFAULT="$(sed -n 's/^hamstr.version=//p' gradle.properties)"
          if [ "$DEFAULT" != "$VERSION" ]; then
            echo "::error::gradle.properties says hamstr.version=$DEFAULT. Set it to $VERSION first (AGENTS.md, Releasing)."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::$TAG already exists. Pick the next version."
            exit 1
          fi
          if [ ! -f ".github/release-notes/$TAG.md" ]; then
            echo "::warning::No .github/release-notes/$TAG.md; GitHub writes the notes from the commits."
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 ndk;28.2.13676358 cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v6

      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.HAMSTR_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HAMSTR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HAMSTR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HAMSTR_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::HAMSTR_KEYSTORE_B64 is not set; releases must be signed with the same key every time."
            exit 1
          fi
          mkdir -p signing
          echo "$KEYSTORE_B64" | base64 --decode > signing/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > signing/keystore.properties

      - name: Build
        run: ./gradlew --no-daemon assembleRelease -Phamstr.version="${TAG#v}"

      - name: Collect APKs
        run: |
          VERSION="${TAG#v}"
          mkdir dist
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "dist/Hamstr-$VERSION-$abi.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -la dist

      # Started by hand, the tag comes only now, once the APKs are built: a failed build leaves
      # no tag behind. Pushed with this run's token, it starts no second run.
      - name: Tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Hamstr ${TAG#v}"
          git push origin "$TAG"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=".github/release-notes/$TAG.md"
          if [ -f "$NOTES" ]; then set -- --notes-file "$NOTES"; else set -- --generate-notes; fi
          gh release create "$TAG" dist/* --title "$TAG" --verify-tag "$@"

  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-latest, name: macos-arm64 }
          - { os: ubuntu-latest, name: linux-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Gradle configures the Android modules too, so the SDK has to be there.
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0"

      - uses: gradle/actions/setup-gradle@v6

      # Windows' setup is made with Inno Setup (desktop/windows/hamstr.iss).
      - name: Inno Setup
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then choco install innosetup -y --no-progress; fi

      # The Bluetooth helper (desktop/ble) is Rust; on Linux it speaks to BlueZ over D-Bus.
      - uses: dtolnay/rust-toolchain@stable

      - name: D-Bus headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Installer
        shell: bash
        run: ./gradlew --no-daemon :desktop:packageDistributionForCurrentOS -Phamstr.version="${TAG#v}" -Phamstr.requireBle=true

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          mkdir dist
          for f in desktop/build/compose/binaries/main/*/*; do
            case "$f" in *.exe|*.dmg|*.deb) cp "$f" "dist/Hamstr-$VERSION-${{ matrix.name }}.${f##*.}" ;; esac
          done
          # Windows also gets the app folder as a zip, to unpack and run without installing.
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd desktop/build/compose/binaries/main/app && 7z a -tzip "$GITHUB_WORKSPACE/dist/Hamstr-$VERSION-${{ matrix.name }}-portable.zip" Hamstr > /dev/null)
          fi
          ls -la dist
          gh release upload "$TAG" dist/*

  # One checksum file for the whole release: the APKs' plus every desktop file.
  checksums:
    needs: [release, desktop]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Signed with the release key: the desktop app only installs what this signature covers
      # (ReleaseKeys.HAMSTR). The secret holds the PEM of signing/hamstr-release-key.pem.
      - name: SHA256SUMS.txt and its signature
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.HAMSTR_SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY" || { echo "HAMSTR_SIGNING_KEY is not set"; exit 1; }
          mkdir all && cd all
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "Hamstr-*"
          sha256sum Hamstr-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          printf '%s\n' "$SIGNING_KEY" > key.pem
          openssl dgst -sha256 -sign key.pem -out SHA256SUMS.txt.sig SHA256SUMS.txt
          rm key.pem
          gh release upload "$TAG" SHA256SUMS.txt SHA256SUMS.txt.sig --repo "$GITHUB_REPOSITORY" --clobber
