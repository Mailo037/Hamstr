name: Build

# Every push and pull request: compile the app and the desktop app, run the unit tests and
# keep the APKs for a week so a build can be tried without cutting a release.
on:
  push:
    branches: [main]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 ndk;28.2.13676358 cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v6

      # The phone's unit tests, the shared code's on the desktop JVM (Nearby, the stash, the
      # engine's rules) and the desktop app's own (its player skips without fetched tools).
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest :shared:desktopTest :desktop:test

      - name: Debug APKs
        run: ./gradlew --no-daemon assembleDebug

      - name: Desktop app
        run: ./gradlew --no-daemon :desktop:compileKotlin

      - uses: actions/upload-artifact@v7
        with:
          name: hamstr-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  # The desktop's Bluetooth helper on every system it ships for, since this computer only builds its own.
  bluetooth:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop/ble
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: D-Bus headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
